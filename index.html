<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf7f0;
    --paper-dark:#ece5d5;
    --card:#ffffff;
    --ink:#1f2420;
    --ink-soft:#6b6455;
    --ink-faint:#a89f8c;
    --accent:#a8722f;
    --accent-deep:#7d4f1e;
    --accent-soft:#f0e2c8;
    --good:#2f7a4f;
    --good-bg:#d9efe0;
    --bad:#a3352b;
    --bad-bg:#fbeae7;
    --line:#e3dcc9;
  }
  *{box-sizing:border-box;}
  :root{
    font-variant-numeric: lining-nums tabular-nums;
  }
  /* Cifras consistentes: mismas alturas y ancho fijo en TODO número, sea en Fraunces o JetBrains Mono */
  .price, .unit, .ahorro, .breakdown, .profit, .stamp,
  input[type="number"], select, #prodTitle, .hs-number, .hs-original-number,
  .saved-tag, .d{
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  body{
    margin:0;
    padding:40px 14px 70px;
    background:
      radial-gradient(circle at 15% 0%, #f3ecdb 0%, transparent 45%),
      var(--paper-dark);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:500px; }

  .ticket{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 20px 45px -18px rgba(31,36,32,.28), 0 2px 8px rgba(31,36,32,.06);
    overflow:hidden;
  }

  header{
    text-align:center;
    padding:34px 24px 24px;
    background:linear-gradient(180deg, var(--accent-soft), var(--card) 90%);
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.24em;
    color:var(--accent-deep);
    text-transform:uppercase;
    font-weight:500;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:30px;
    margin:8px 0 0;
    letter-spacing:-.01em;
  }
  header .saved-tag{
    display:inline-block;
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--good);
    opacity:0;
    transition:opacity .3s ease;
  }
  header .saved-tag.show{ opacity:1; }

  .section{
    padding:22px 24px;
    border-bottom:1px solid var(--line);
  }
  .section h2{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    margin:0 0 16px;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:14px;
  }
  .field:last-child{ margin-bottom:0; }
  .field label{
    font-size:14.5px;
    color:var(--ink);
    font-weight:500;
    line-height:1.3;
  }
  .field .hint{
    display:block;
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:2px;
    font-weight:400;
  }
  input[type="number"], input[type="text"]{
    padding:9px 11px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    color:var(--ink);
    border-radius:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  input[type="number"]{ width:118px; text-align:right; }
  input[type="text"]{ width:170px; }
  input:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
  }

  #ganancia{ width:130px; }

  select{
    padding:9px 30px 9px 12px;
    border:1.5px solid var(--line);
    background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0Z' fill='%236b6455'/></svg>") no-repeat right 12px center;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    border-radius:8px;
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
    width:100%;
    transition:border-color .15s ease, background-color .15s ease;
  }
  select:focus{
    outline:none;
    border-color:var(--accent);
    background-color:#fff;
  }

  .tiers-grid{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:12px 14px;
    align-items:center;
  }
  .tiers-grid .tier-name{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .results{ padding:22px 24px 8px; }
  .row{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:14px 16px;
    margin-bottom:10px;
    border-radius:10px;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .row.warn{ background:var(--bad-bg); border-color:#eccbc5; }
  .row.good{ background:var(--good-bg); border-color:#8fc9a4; border-width:1.5px; }
  .row .row-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .row .qty{
    font-family:'JetBrains Mono', monospace;
    font-size:14.5px;
    color:var(--ink);
    font-weight:700;
    min-width:82px;
    padding-top:2px;
  }
  .row .qty .d{
    display:inline-block;
    margin-top:6px;
    font-weight:700;
    color:var(--accent-deep);
    background:var(--accent-soft);
    border-radius:5px;
    padding:2px 6px;
    font-size:11px;
  }
  .row .nums{ text-align:right; }
  .row .price{
    font-family:'Fraunces', serif;
    font-size:21px;
    font-weight:600;
    font-optical-sizing:auto;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .row .unit{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .row .ahorro{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--accent-deep);
    font-weight:700;
    margin-top:3px;
  }
  .row .breakdown{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--line);
    font-weight:500;
  }
  .row .profit{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--good);
    font-weight:600;
    text-align:right;
  }
  .row .profit.bad{ color:var(--bad); font-weight:700; }
  .stamp{
    display:inline-block;
    align-self:flex-end;
    padding:3px 8px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    border:1px solid var(--bad);
    border-radius:5px;
    color:var(--bad);
    text-transform:uppercase;
    font-weight:700;
  }

  .save-bar{
    padding:18px 24px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .checkbox-row input{
    width:17px; height:17px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .secondary-btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .secondary-btn:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep); }
  .secondary-btn:active{ transform:scale(.97); }
  button#saveBtn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button#saveBtn:hover{ background:var(--accent-deep); }
  button#saveBtn:active{ transform:scale(.97); }
  button#saveBtn:disabled{
    background:var(--ink-faint);
    cursor:not-allowed;
  }

  .history{ margin-top:18px; }
  .history-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:0 4px 12px;
  }
  .history-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color:var(--ink);
    margin:0;
  }
  .history-head span{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-faint);
  }
  .hist-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 4px 14px -8px rgba(31,36,32,.18);
  }
  .hist-item .hist-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .hist-item .hist-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
  }
  .hist-item .hist-date{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .hist-item .hist-note{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:8px;
    font-weight:500;
  }
  .hist-item .hist-summary{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    min-width:0;
  }
  .hist-item .hist-summary .hs-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    min-width:0;
    padding:4px 0;
    line-height:1.15;
  }
  .hist-item .hist-summary .hs-row + .hs-row{
    border-top:1px dashed var(--line);
  }
  .hist-item .hist-summary .hs-label{
    color:var(--ink-soft);
    font-weight:500;
    flex:0 1 auto;
    white-space:nowrap;
  }
  .hist-item .hist-summary .hs-priceblock{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:0;
    min-width:0;
    flex:0 1 auto;
  }
  .hist-item .hist-summary .hs-sub{
    display:flex;
    align-items:baseline;
    gap:6px;
    min-width:0;
    max-width:100%;
    flex-wrap:wrap;
    justify-content:flex-end;
    line-height:1.1;
    font-size:10px;
  }
  .hist-item .hist-summary .hs-sub-empty{
    visibility:hidden;
  }
  .hist-item .hist-summary .hs-original{
    color:var(--ink-faint);
    font-weight:500;
    font-size:10px;
    text-decoration:line-through;
    white-space:nowrap;
  }
  .hist-item .hist-summary .hs-ahorro{
    color:var(--accent-deep);
    font-weight:700;
    font-size:10px;
    white-space:nowrap;
  }
  .hist-item .hist-summary .hs-main{
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    line-height:1.15;
  }
  .hist-item .hist-summary .hs-main.bad{ color:var(--bad); }
  .hist-item .hist-actions{
    margin-top:10px;
    display:flex;
    gap:10px;
  }
  .hist-item .hist-actions button{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .hist-item .hist-actions button.danger{
    color:var(--bad);
    border-color:#eccbc5;
  }
  .hist-item .hist-actions button:hover{ background:var(--paper-dark); }
  .hist-item .hist-actions button.share{
    color:var(--accent-deep);
    border-color:var(--accent-soft);
    background:var(--accent-soft);
  }
  .hist-item .hist-actions button.share:hover{ background:#e6d3ac; }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .empty-hist{
    text-align:center;
    padding:24px;
    color:var(--ink-faint);
    font-size:13px;
    font-family:'JetBrains Mono', monospace;
  }
  .missing-fields{
    text-align:center;
    padding:26px 20px;
    color:var(--bad);
    background:var(--bad-bg);
    border:1px dashed #eccbc5;
    border-radius:10px;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:600;
    line-height:1.5;
  }
  input.field-missing, select.field-missing{
    border-color:var(--bad) !important;
  }

  footer{
    text-align:center;
    padding:16px 20px 4px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    letter-spacing:.04em;
  }

  @media (max-width:380px){
    input[type="number"]{ width:100px; }
    input[type="text"]{ width:140px; }
    .hist-item .hist-summary{ font-size:11px; }
    .hist-item .hist-summary .hs-label{ font-size:11px; }
    .hist-item .hist-summary .hs-main{ font-size:11.5px; }
    .hist-item .hist-summary .hs-original,
    .hist-item .hist-summary .hs-ahorro{ font-size:9.5px; }
    .hist-item .hist-actions{ flex-wrap:wrap; }
    .hist-item .hist-actions button{ flex:1 1 auto; padding:6px 8px; font-size:11px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="ticket">
    <header>
      <div class="eyebrow">Calculadora de venta</div>
      <h1 id="prodTitle">Mi Producto</h1>
      <div class="saved-tag" id="savedTag">✓ configuración guardada</div>
    </header>

    <div class="section">
      <h2>Datos base</h2>
      <div class="field">
        <label for="nombre">Nombre del producto</label>
        <input type="text" id="nombre" placeholder="Nombre del producto">
      </div>
      <div class="field">
        <label for="costo">Precio de costo <span class="hint">por pieza</span></label>
        <input type="number" id="costo" placeholder="0.00" step="0.01">
      </div>
      <div class="field">
        <label for="envio">Envío <span class="hint">fijo por pedido</span></label>
        <input type="number" id="envio" placeholder="0.00" step="0.01">
      </div>
      <div class="field">
        <label for="ganancia">Ganancia deseada <span class="hint">% sobre costo + envío, sin descuento</span></label>
        <select id="ganancia"></select>
      </div>
      <div class="field">
        <label for="redondeo">Redondeo de precio <span class="hint">siempre hacia arriba, nunca perdés margen</span></label>
        <select id="redondeo">
          <option value="none">Exacto (sin redondear)</option>
          <option value="entero">Entero (0)</option>
          <option value="dinamico" selected>Dinámico (5 o 9, el más cercano)</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2>Cliente especial</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="especialCheck">
        Aplicar descuento especial a 1 pieza
      </label>
      <div class="field" id="especialPctField" style="margin-top:14px; display:none;">
        <label for="descEspecial">Descuento especial</label>
        <select id="descEspecial"></select>
      </div>
    </div>

    <div class="section">
      <h2>Descuento por cantidad</h2>
      <div class="tiers-grid">
        <div class="tier-name">3 piezas</div>
        <select id="desc3"></select>
        <div class="tier-name">6 piezas</div>
        <select id="desc6"></select>
        <div class="tier-name">12 piezas</div>
        <select id="desc12"></select>
      </div>
    </div>

    <div class="results" id="results"></div>

    <div class="save-bar">
      <button id="newBtn" class="secondary-btn">Nuevo precio</button>
      <button id="saveBtn" disabled>Guardar</button>
    </div>

    <footer>Los recuadros rojos pierden dinero — ajustá el descuento o la ganancia</footer>
  </div>

  <div class="history" id="historyWrap">
    <div class="history-head">
      <h2>Historial</h2>
      <span id="histCount">0 guardados</span>
    </div>
    <div id="historyList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const numInputs = ['nombre','costo','envio'];
  const pctSelects = ['ganancia','desc3','desc6','desc12','descEspecial'];
  const otherSelects = ['redondeo'];
  const allFields = [...numInputs, ...pctSelects, ...otherSelects];

  // Redondeo SIEMPRE hacia arriba (Math.ceil de la unidad correspondiente).
  // Nunca hacia abajo: así el % de ganancia elegido queda garantizado como mínimo,
  // el precio final real da igual o mejor margen, nunca menos.
  function redondearPrecio(precio, modo){
    if(modo === 'entero') return Math.ceil(precio);
    if(modo === '5') return Math.ceil(precio / 5) * 5;
    if(modo === '9'){
      const base = Math.ceil(precio / 10) * 10; // siguiente decena hacia arriba
      const candidato = base - 1; // termina en 9
      return candidato >= precio ? candidato : candidato + 10;
    }
    if(modo === 'dinamico'){
      const cand5 = Math.ceil(precio / 5) * 5; // múltiplo de 5 hacia arriba
      const base9 = Math.ceil(precio / 10) * 10;
      const cand9raw = base9 - 1;
      const cand9 = cand9raw >= precio ? cand9raw : cand9raw + 10; // terminación en 9 hacia arriba
      // ambos ya son >= precio (nunca se pierde margen); elegimos el más cercano al precio exacto
      const dist5 = cand5 - precio;
      const dist9 = cand9 - precio;
      return dist5 <= dist9 ? cand5 : cand9; // empate: preferimos el múltiplo de 5 (queda un poco más barato para el cliente)
    }
    return precio; // 'none'
  }
  const PCT_OPTIONS = Array.from({length:21}, (_, i) => i * 5); // 0,5,10,...,100

  function buildSelects(){
    pctSelects.forEach(id => {
      const sel = $(id);
      sel.innerHTML = PCT_OPTIONS.map(v => `<option value="${v}">${v}%</option>`).join('');
    });
    $('ganancia').insertAdjacentHTML('afterbegin', '<option value="" selected disabled>Elegí %</option>');
    $('desc3').value = 5;
    $('desc6').value = 10;
    $('desc12').value = 15;
    $('descEspecial').value = 10;
  }

  function money(n){
    return 'L ' + n.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function moneyNum(n){
    return n.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function camposCompletos(){
    return $('nombre').value.trim() !== '' && $('costo').value !== '' && $('envio').value !== '' && $('ganancia').value !== '';
  }

  function getState(){
    return {
      nombre: $('nombre').value || 'Producto',
      costo: parseFloat($('costo').value) || 0,
      envio: parseFloat($('envio').value) || 0,
      ganancia: parseFloat($('ganancia').value) || 0,
      desc3: parseFloat($('desc3').value) || 0,
      desc6: parseFloat($('desc6').value) || 0,
      desc12: parseFloat($('desc12').value) || 0,
      especial: $('especialCheck').checked,
      descEspecial: parseFloat($('descEspecial').value) || 0,
      redondeo: $('redondeo').value || 'none',
    };
  }

  function applyState(s){
    $('nombre').value = s.nombre ?? '';
    $('costo').value = (s.costo === undefined || s.costo === null) ? '' : s.costo;
    $('envio').value = (s.envio === undefined || s.envio === null) ? '' : s.envio;
    $('ganancia').value = (s.ganancia === undefined || s.ganancia === null || s.ganancia === '') ? '' : s.ganancia;
    $('desc3').value = s.desc3 ?? 5;
    $('desc6').value = s.desc6 ?? 10;
    $('desc12').value = s.desc12 ?? 15;
    $('especialCheck').checked = !!s.especial;
    $('descEspecial').value = s.descEspecial ?? 10;
    $('especialPctField').style.display = $('especialCheck').checked ? 'flex' : 'none';
    $('redondeo').value = s.redondeo ?? 'dinamico';
  }

  function resetForm(){
    $('nombre').value = '';
    $('costo').value = '';
    $('envio').value = '';
    $('ganancia').value = '';
    $('desc3').value = 5;
    $('desc6').value = 10;
    $('desc12').value = 15;
    $('especialCheck').checked = false;
    $('descEspecial').value = 10;
    $('especialPctField').style.display = 'none';
    $('redondeo').value = 'dinamico';
  }

  function computeTiers(state){
    // La ganancia se calcula sobre el costo del producto (el envío no genera ganancia,
    // solo se traslada al cliente como un costo fijo por pedido).
    const gananciaMontoUnit = state.costo * (state.ganancia / 100);
    const precioBaseUnit = state.costo + gananciaMontoUnit; // precio por pieza SIN envío
    const descUnaPieza = state.especial ? (state.descEspecial || 0) : 0;
    const tiers = [
      { qty: 1,  desc: descUnaPieza, especial: descUnaPieza > 0 },
      { qty: 3,  desc: state.desc3 },
      { qty: 6,  desc: state.desc6 },
      { qty: 12, desc: state.desc12 },
    ];
    return tiers.map(t => {
      const precioUnitDesc = precioBaseUnit * (1 - t.desc/100); // precio por pieza con descuento, sin envío
      const precioProductos = precioUnitDesc * t.qty;
      const envioLinea = state.envio; // envío FIJO por pedido, no escala con la cantidad
      const precioTotalExacto = precioProductos + envioLinea;
      // Redondeo hacia arriba sobre el precio final mostrado al cliente: nunca resta margen.
      const precioTotal = redondearPrecio(precioTotalExacto, state.redondeo);
      const precioUnit = precioTotal / t.qty; // precio "c/u" mostrado, ya con el envío diluido entre las piezas
      const costoLinea = state.costo * t.qty;
      const gananciaTotal = precioTotal - (costoLinea + envioLinea); // el envío se cancela: es costo y precio a la vez
      const gananciaUnit = gananciaTotal / t.qty;
      const precioUnitDescRedondeado = (precioTotal - envioLinea) / t.qty;
      const ahorroTotal = (precioBaseUnit - precioUnitDescRedondeado) * t.qty; // ahorro solo por el descuento de volumen
      return { ...t, precioUnit, precioTotal, gananciaUnit, gananciaTotal,
      costoTotalUnit: state.costo + state.envio,
      envioLinea, costoLinea, ahorroTotal };
    });
  }

  function calcular(){
    const completos = camposCompletos();

    $('nombre').classList.toggle('field-missing', $('nombre').value.trim() === '');
    $('costo').classList.toggle('field-missing', $('costo').value === '');
    $('envio').classList.toggle('field-missing', $('envio').value === '');
    $('ganancia').classList.toggle('field-missing', $('ganancia').value === '');

    if(!completos){
      $('prodTitle').textContent = $('nombre').value.trim() || 'Nuevo producto';
      $('results').innerHTML = '<div class="missing-fields">Completá nombre, costo, envío y ganancia para ver los precios</div>';
      $('saveBtn').disabled = true;
      return;
    }

    const state = getState();
    $('prodTitle').textContent = state.nombre;
    const tiers = computeTiers(state);

    let html = '';
    tiers.forEach(t => {
      const perdiendo = t.gananciaUnit < 0;
      const label = t.qty === 1 ? '1 pieza' : t.qty + ' piezas';
      html += `
        <div class="row ${perdiendo ? 'warn' : 'good'}">
          <div class="row-top">
            <div class="qty">${label}${t.desc > 0 ? `<span class="d">−${t.desc}%</span>` : ''}</div>
            <div class="nums">
              <div class="price">${money(t.precioTotal)}</div>
              <div class="unit">c/u: ${money(t.precioUnit)}</div>
              ${t.ahorroTotal > 0 ? `<div class="ahorro">ahorra ${money(t.ahorroTotal)}</div>` : ''}
            </div>
          </div>
          <div class="profit ${perdiendo ? 'bad' : ''}">
            ganancia total ${money(t.gananciaTotal)} · ${money(t.gananciaUnit)} c/u
          </div>
          <div class="breakdown">
            costo ${money(t.costoLinea)} + envío ${t.envioLinea > 0 ? money(t.envioLinea) : 'gratis'} = ${money(t.costoLinea + t.envioLinea)}
          </div>
          ${perdiendo ? '<div class="stamp">Perdés dinero</div>' : ''}
        </div>`;
    });
    $('results').innerHTML = html;
    $('saveBtn').disabled = false;
  }

  // ---------- Configuración persistente (localStorage del navegador) ----------
  const CONFIG_KEY = 'calc_config';
  let saveTimer = null;

  async function loadConfig(){
    try{
      const raw = localStorage.getItem(CONFIG_KEY);
      if(raw){
        const s = JSON.parse(raw);
        applyState(s);
      }
    }catch(e){ /* no había config guardada todavía */ }
    // El producto (nombre/costo/envío/ganancia) SIEMPRE arranca vacío al abrir,
    // aunque los ajustes (descuentos, redondeo) sí se recuerdan.
    $('nombre').value = '';
    $('costo').value = '';
    $('envio').value = '';
    $('ganancia').value = '';
    calcular();
  }

  function persistConfig(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{
        localStorage.setItem(CONFIG_KEY, JSON.stringify(getState()));
        flashSavedTag();
      }catch(e){
        console.error('No se pudo guardar la configuración', e);
      }
    }, 500);
  }

  function flashSavedTag(){
    const tag = $('savedTag');
    tag.classList.add('show');
    clearTimeout(tag._t);
    tag._t = setTimeout(() => tag.classList.remove('show'), 1400);
  }

  // ---------- Historial (localStorage del navegador) ----------
  const HIST_KEY = 'calc_historial';
  let historial = [];

  async function loadHistorial(){
    try{
      const raw = localStorage.getItem(HIST_KEY);
      historial = raw ? JSON.parse(raw) : [];
    }catch(e){
      historial = [];
    }
    renderHistorial();
  }

  async function persistHistorial(){
    try{
      localStorage.setItem(HIST_KEY, JSON.stringify(historial));
    }catch(e){
      console.error('No se pudo guardar el historial', e);
    }
  }

  function renderHistorial(){
    $('histCount').textContent = historial.length + (historial.length === 1 ? ' guardado' : ' guardados');
    if(historial.length === 0){
      $('historyList').innerHTML = '<div class="empty-hist">Todavía no guardaste ningún cálculo.</div>';
      return;
    }
    let html = '';
    [...historial].reverse().forEach((entry) => {
      const idx = historial.indexOf(entry);
      const tiers = computeTiers(entry.state);
      const lineas = tiers.map(t => {
        const label = t.qty === 1 ? '1 pieza' : t.qty + ' piezas';
        const bad = t.gananciaUnit < 0;
        const subHtml = t.ahorroTotal > 0
          ? `<div class="hs-sub">
               <span class="hs-original">L ${moneyNum(t.precioTotal + t.ahorroTotal)}</span>
               <span class="hs-ahorro">ahorrás L ${moneyNum(t.ahorroTotal)}</span>
             </div>`
          : `<div class="hs-sub hs-sub-empty">&nbsp;</div>`;
        return `<div class="hs-row">
                   <div class="hs-label">${label}</div>
                   <div class="hs-priceblock">
                     ${subHtml}
                     <div class="hs-main ${bad ? 'bad' : ''}">L ${moneyNum(t.precioTotal)}${bad ? ' ⚠' : ''}</div>
                   </div>
                 </div>`;
      }).join('');
      html += `
        <div class="hist-item">
          <div class="hist-top">
            <div class="hist-name">${entry.state.nombre}</div>
            <div class="hist-date">${entry.date}</div>
          </div>
          ${entry.state.envio > 0 ? `<div class="hist-note">envío: ${money(entry.state.envio)} incluido por pedido</div>` : `<div class="hist-note">envío gratis</div>`}
          ${entry.state.especial ? `<div class="hist-note">descuento especial 1 pieza: −${entry.state.descEspecial}%</div>` : ''}
          <div class="hist-summary">${lineas}</div>
          <div class="hist-actions">
            <button class="share" onclick="compartirHistorial(${idx})">Generar imagen</button>
            <button onclick="cargarHistorial(${idx})">Cargar</button>
            <button class="danger" onclick="borrarHistorial(${idx})">Borrar</button>
          </div>
        </div>`;
    });
    $('historyList').innerHTML = html;
  }

  window.cargarHistorial = function(idx){
    const entry = historial[idx];
    if(!entry) return;
    applyState(entry.state);
    calcular();
    persistConfig();
    window.scrollTo({top:0, behavior:'smooth'});
  };

  window.borrarHistorial = async function(idx){
    historial.splice(idx, 1);
    await persistHistorial();
    renderHistorial();
  };

  function showToast(msg){
    let t = $('toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.classList.remove('show'), 2200);
  }

  window.compartirHistorial = async function(idx){
    const entry = historial[idx];
    if(!entry) return;
    try{
      await document.fonts.ready;
    }catch(e){ /* seguimos igual */ }

    const tiers = computeTiers(entry.state);
    const now = new Date();
    const fechaHora = now.toLocaleDateString('es-HN', {day:'2-digit', month:'2-digit', year:'numeric'}) +
                       '  ·  ' + now.toLocaleTimeString('es-HN', {hour:'2-digit', minute:'2-digit'});

    const W = 640;
    const rowH = 108;
    const topH = 150;
    const bottomH = 110;
    const H = topH + tiers.length * rowH + bottomH;

    const canvas = document.createElement('canvas');
    const scale = 2; // nitidez
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // fondo
    ctx.fillStyle = '#faf7f0';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#e3dcc9';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);

    // header banda
    ctx.fillStyle = '#f0e2c8';
    ctx.fillRect(0, 0, W, topH);
    ctx.strokeStyle = '#e3dcc9';
    ctx.beginPath();
    ctx.moveTo(0, topH); ctx.lineTo(W, topH); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#7d4f1e';
    ctx.font = '600 11px "JetBrains Mono", monospace';
    ctx.fillText('LISTA DE PRECIOS', W/2, 40);

    ctx.fillStyle = '#1f2420';
    ctx.font = '600 32px "Fraunces", serif';
    ctx.fillText(entry.state.nombre, W/2, 82);

    ctx.fillStyle = '#6b6455';
    ctx.font = '500 13px "JetBrains Mono", monospace';
    ctx.fillText(entry.state.envio > 0 ? 'Envío incluido' : 'Envío gratis', W/2, 112);

    // filas
    let y = topH;
    tiers.forEach((t, i) => {
      const bad = t.gananciaUnit < 0;
      if(bad){ ctx.fillStyle = '#fbeae7'; } else { ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#faf7f0'; }
      ctx.fillRect(0, y, W, rowH);
      ctx.strokeStyle = '#e3dcc9';
      ctx.beginPath(); ctx.moveTo(0, y + rowH); ctx.lineTo(W, y + rowH); ctx.stroke();

      const label = t.qty === 1 ? '1 pieza' : t.qty + ' piezas';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#1f2420';
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillText(label, 32, y + 42);

      if(t.desc > 0){
        ctx.fillStyle = '#a8722f';
        ctx.font = '600 13px "JetBrains Mono", monospace';
        ctx.fillText('descuento por volumen', 32, y + 64);
      } else {
        ctx.fillStyle = '#a89f8c';
        ctx.font = '500 13px "JetBrains Mono", monospace';
        ctx.fillText('precio regular', 32, y + 64);
      }

      if(t.ahorroTotal > 0){
        const original = 'L ' + (t.precioTotal + t.ahorroTotal).toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2});
        ctx.textAlign = 'right';
        ctx.font = '500 13px "JetBrains Mono", monospace';
        ctx.fillStyle = '#a89f8c';
        const oy = y + 24;
        ctx.fillText(original, W - 32, oy);
        const ow = ctx.measureText(original).width;
        ctx.strokeStyle = '#a89f8c';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(W - 32 - ow, oy - 4);
        ctx.lineTo(W - 32, oy - 4);
        ctx.stroke();
      }

      ctx.textAlign = 'right';
      ctx.fillStyle = '#1f2420';
      ctx.font = '700 26px "Fraunces", serif';
      ctx.fillText('L ' + t.precioTotal.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2}), W - 32, y + 56);

      ctx.fillStyle = '#6b6455';
      ctx.font = '500 12px "JetBrains Mono", monospace';
      ctx.fillText('c/u: L ' + t.precioUnit.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2}), W - 32, y + 76);

      if(t.ahorroTotal > 0){
        ctx.fillStyle = '#2f7a4f';
        ctx.font = '700 13px "JetBrains Mono", monospace';
        ctx.fillText('ahorrás L ' + t.ahorroTotal.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2}), W - 32, y + 96);
      }

      y += rowH;
    });

    // pie con fecha y hora (seguridad)
    ctx.fillStyle = '#241f16';
    ctx.fillRect(0, y, W, bottomH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e3dcc9';
    ctx.font = '500 11px "JetBrains Mono", monospace';
    ctx.fillText('PRECIOS VÁLIDOS AL MOMENTO DE ESTA COTIZACIÓN', W/2, y + 38);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 20px "JetBrains Mono", monospace';
    ctx.fillText(fechaHora, W/2, y + 68);
    ctx.fillStyle = '#a89f8c';
    ctx.font = '500 10.5px "JetBrains Mono", monospace';
    ctx.fillText('generado automáticamente · verificá la fecha antes de aceptar', W/2, y + 90);

    canvas.toBlob(async (blob) => {
      if(!blob){ showToast('No se pudo generar la imagen'); return; }
      const fileName = `precios_${entry.state.nombre.replace(/\s+/g,'_')}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], title: entry.state.nombre });
          showToast('Imagen lista ✓');
          return;
        }catch(e){ /* si cancela o falla, seguimos a la descarga */ }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Imagen descargada ✓');
    }, 'image/png');
  };

  $('newBtn').addEventListener('click', () => {
    resetForm();
    calcular();
    persistConfig();
  });

  $('saveBtn').addEventListener('click', async () => {
    if(!camposCompletos()) return;
    const state = getState();
    const now = new Date();
    const date = now.toLocaleDateString('es-HN', {day:'2-digit', month:'2-digit', year:'2-digit'}) +
                 ' ' + now.toLocaleTimeString('es-HN', {hour:'2-digit', minute:'2-digit'});
    historial.push({ state, date });
    await persistHistorial();
    renderHistorial();
    resetForm();
    calcular();
    persistConfig();
    showToast('Guardado ✓ — listo para el siguiente producto');
  });

  $('especialCheck').addEventListener('change', () => {
    $('especialPctField').style.display = $('especialCheck').checked ? 'flex' : 'none';
    calcular();
    persistConfig();
  });

  allFields.forEach(id => {
    $(id).addEventListener('input', () => { calcular(); persistConfig(); });
    $(id).addEventListener('change', () => { calcular(); persistConfig(); });
  });

  buildSelects();
  loadConfig();
  loadHistorial();
</script>

</body>
</html>
